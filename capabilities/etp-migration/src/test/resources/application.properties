spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.security.oauth2.resourceserver.jwt.issuer-uri=${ETP_MIGRATION_KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/etp}

etp.migration.worker.id=test-worker
etp.migration.worker.lease-duration=PT5M
etp.migration.target.postgresql.schema=migration_staging
