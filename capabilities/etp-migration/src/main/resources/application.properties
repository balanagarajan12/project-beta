spring.config.import=optional:file:.env[.properties]

spring.application.name=etp-migration

spring.datasource.url=${ETP_MIGRATION_DB_URL:jdbc:postgresql://localhost:55433/etp_migration?options=-c%20TimeZone%3DUTC}
spring.datasource.username=${ETP_MIGRATION_DB_USERNAME:etp_admin}
spring.datasource.password=${ETP_MIGRATION_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Control-plane pool. Hikari setters take milliseconds.
spring.datasource.hikari.pool-name=etp-migration-control-plane
spring.datasource.hikari.maximum-pool-size=${ETP_MIGRATION_DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${ETP_MIGRATION_DB_POOL_MIN_IDLE:${spring.datasource.hikari.maximum-pool-size}}
spring.datasource.hikari.connection-timeout=${ETP_MIGRATION_DB_POOL_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${ETP_MIGRATION_DB_POOL_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${ETP_MIGRATION_DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${ETP_MIGRATION_DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.keepalive-time=${ETP_MIGRATION_DB_POOL_KEEPALIVE_TIME_MS:120000}
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.security.oauth2.resourceserver.jwt.issuer-uri=${ETP_MIGRATION_KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/etp}
# Comma-separated. When set, a token must carry at least one of these in "aud". Empty keeps issuer-only validation.
spring.security.oauth2.resourceserver.jwt.audiences=${ETP_MIGRATION_JWT_AUDIENCES:}

server.port=${ETP_MIGRATION_SERVER_PORT:8082}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${ETP_MIGRATION_SHUTDOWN_GRACE_PERIOD:30s}

etp.migration.batch-size=${ETP_MIGRATION_BATCH_SIZE:10000}
etp.migration.worker.id=${ETP_MIGRATION_WORKER_ID:}
etp.migration.worker.lease-duration=${ETP_MIGRATION_WORKER_LEASE_DURATION:PT5M}
# Background POST /execute, and the separate pool for reconcile, promotion preparation, and promote.
# Each pool runs one job at a time by default so a large migration does not exhaust the control-plane pool.
# Queue capacity, lease, progress interval, and recovery interval are shared. A rejected schedule leaves the job QUEUED for recovery.
etp.migration.execution.max-concurrent-runs=${ETP_MIGRATION_EXECUTION_MAX_CONCURRENT_RUNS:1}
etp.migration.execution.queue-capacity=${ETP_MIGRATION_EXECUTION_QUEUE_CAPACITY:32}
etp.migration.execution.lease-duration=${ETP_MIGRATION_EXECUTION_LEASE_DURATION:PT5M}
# Silence after the last byte, stage, or batch report. A live thread does not renew the lease.
etp.migration.execution.progress-interval=${ETP_MIGRATION_EXECUTION_PROGRESS_INTERVAL:PT30S}
etp.migration.execution.recovery-interval-ms=${ETP_MIGRATION_EXECUTION_RECOVERY_INTERVAL_MS:15000}
etp.migration.storage.root=${ETP_MIGRATION_STORAGE_ROOT:./data/migration}
etp.migration.target.connect-timeout=${ETP_MIGRATION_TARGET_CONNECT_TIMEOUT:PT2S}
etp.migration.target.read-timeout=${ETP_MIGRATION_TARGET_READ_TIMEOUT:PT10S}
etp.migration.target.uam.base-url=${ETP_MIGRATION_TARGET_UAM_BASE_URL:http://localhost:8090}
etp.migration.target.uam.path=${ETP_MIGRATION_TARGET_UAM_PATH:/api/v1/{entity}}
etp.migration.target.uam.connect-timeout=${ETP_MIGRATION_TARGET_UAM_CONNECT_TIMEOUT:${etp.migration.target.connect-timeout}}
etp.migration.target.uam.read-timeout=${ETP_MIGRATION_TARGET_UAM_READ_TIMEOUT:${etp.migration.target.read-timeout}}
etp.migration.target.uam.token-uri=${ETP_MIGRATION_TARGET_UAM_TOKEN_URI:}
etp.migration.target.uam.client-id=${ETP_MIGRATION_TARGET_UAM_CLIENT_ID:}
etp.migration.target.uam.client-secret=${ETP_MIGRATION_TARGET_UAM_CLIENT_SECRET:}
etp.migration.target.uam.scope=${ETP_MIGRATION_TARGET_UAM_SCOPE:}
etp.migration.target.postgresql.url=${ETP_MIGRATION_TARGET_POSTGRESQL_URL:}
etp.migration.target.postgresql.username=${ETP_MIGRATION_TARGET_POSTGRESQL_USERNAME:}
etp.migration.target.postgresql.password=${ETP_MIGRATION_TARGET_POSTGRESQL_PASSWORD:}
etp.migration.target.postgresql.schema=${ETP_MIGRATION_TARGET_POSTGRESQL_SCHEMA:migration_staging}
etp.migration.target.postgresql.max-pool-size=${ETP_MIGRATION_TARGET_POSTGRESQL_MAX_POOL_SIZE:4}
etp.migration.target.postgresql.pool.connection-timeout=${ETP_MIGRATION_TARGET_POSTGRESQL_POOL_CONNECTION_TIMEOUT:10s}
etp.migration.target.postgresql.pool.validation-timeout=${ETP_MIGRATION_TARGET_POSTGRESQL_POOL_VALIDATION_TIMEOUT:5s}
etp.migration.target.postgresql.pool.idle-timeout=${ETP_MIGRATION_TARGET_POSTGRESQL_POOL_IDLE_TIMEOUT:10m}
etp.migration.target.postgresql.pool.max-lifetime=${ETP_MIGRATION_TARGET_POSTGRESQL_POOL_MAX_LIFETIME:30m}
etp.migration.target.postgresql.pool.keepalive-time=${ETP_MIGRATION_TARGET_POSTGRESQL_POOL_KEEPALIVE_TIME:2m}
# Named connections selected by target.connectionRef or target.stagingConnectionRef.
# Passwords stay here. Example: etp.migration.postgresql.connections.customer-db.url=
etp.migration.postgresql.connections.uam-db.url=${ETP_MIGRATION_PG_UAM_URL:}
etp.migration.postgresql.connections.uam-db.username=${ETP_MIGRATION_PG_UAM_USERNAME:}
etp.migration.postgresql.connections.uam-db.password=${ETP_MIGRATION_PG_UAM_PASSWORD:}
etp.migration.postgresql.connections.migration-db.url=${ETP_MIGRATION_PG_STAGING_URL:}
etp.migration.postgresql.connections.migration-db.username=${ETP_MIGRATION_PG_STAGING_USERNAME:}
etp.migration.postgresql.connections.migration-db.password=${ETP_MIGRATION_PG_STAGING_PASSWORD:}
etp.migration.performance.enabled=${ETP_MIGRATION_PERFORMANCE_ENABLED:false}
etp.migration.performance.record-count=${ETP_MIGRATION_PERFORMANCE_RECORD_COUNT:1000000}
etp.migration.performance.batch-size=${ETP_MIGRATION_PERFORMANCE_BATCH_SIZE:10000}
etp.migration.performance.output-file=${ETP_MIGRATION_PERFORMANCE_OUTPUT_FILE:./data/benchmark/addresses.csv}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
# OpenAPI JSON and Swagger UI are off unless explicitly enabled. Profile dev defaults this to true.
# mvn spring-boot:run also sets the property for the local process. A packaged run does not.
etp.migration.openapi.enabled=${ETP_MIGRATION_OPENAPI_ENABLED:false}
springdoc.api-docs.enabled=${etp.migration.openapi.enabled}
springdoc.swagger-ui.enabled=${etp.migration.openapi.enabled}

# Adds run/batch identifiers from the MDC to the default console and file patterns; empty when not in a migration.
logging.pattern.correlation=%replace(run=%X{migrationRunId} ){'^run= $',''}%replace(batch=%X{migrationBatchId} ){'^batch= $',''}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,controlPlaneDb

# Connect and auth bound. A remote read with no traffic fails after the idle timeout. Host-key verification stays on.
etp.migration.source.sftp.connect-timeout=${ETP_MIGRATION_SFTP_CONNECT_TIMEOUT:PT15S}
etp.migration.source.sftp.idle-timeout=${ETP_MIGRATION_SFTP_IDLE_TIMEOUT:PT10M}
etp.migration.source.sftp.credentials.e2e.username=e2e
etp.migration.source.sftp.credentials.e2e.password=${E2E_SFTP_PASSWORD}
