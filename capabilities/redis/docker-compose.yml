services:
  redis:
    image: redis:7.4-alpine
    container_name: etp-redis
    command: redis-server --requirepass ${ETP_REDIS_PASSWORD:?Set ETP_REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${ETP_REDIS_PASSWORD:?Set ETP_REDIS_PASSWORD}
    ports:
      - "${ETP_REDIS_PORT:-56379}:6379"
    volumes:
      - etp-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  etp-redis-data:
