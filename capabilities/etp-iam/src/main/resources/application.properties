spring.config.import=optional:file:.env[.properties]

spring.application.name=etp-iam

spring.datasource.url=${ETP_IAM_DB_URL:jdbc:postgresql://localhost:55432/etp_iam?options=-c%20TimeZone%3DUTC}
spring.datasource.username=${ETP_IAM_DB_USERNAME:etp_admin}
spring.datasource.password=${ETP_IAM_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.security.oauth2.resourceserver.jwt.issuer-uri=${ETP_IAM_KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/etp}

server.port=${ETP_IAM_SERVER_PORT:8081}

keycloak.base-url=${ETP_IAM_KEYCLOAK_BASE_URL:http://localhost:8180}
keycloak.realm=${ETP_IAM_KEYCLOAK_REALM:etp}
keycloak.token-url=${keycloak.base-url}/realms/${keycloak.realm}/protocol/openid-connect/token
keycloak.login-client-id=${ETP_IAM_KEYCLOAK_LOGIN_CLIENT_ID}
keycloak.login-client-secret=${ETP_IAM_KEYCLOAK_LOGIN_CLIENT_SECRET}

etp.iam.cors.allowed-origins=${ETP_IAM_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
