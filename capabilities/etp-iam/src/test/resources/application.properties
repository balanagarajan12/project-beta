keycloak.base-url=http://localhost:8180
keycloak.realm=etp
keycloak.token-url=${keycloak.base-url}/realms/${keycloak.realm}/protocol/openid-connect/token
keycloak.login-client-id=test-login-client
keycloak.login-client-secret=test-login-secret

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/etp

etp.iam.cors.allowed-origins=http://localhost:5173,http://localhost:5174

spring.datasource.url=jdbc:postgresql://localhost:55432/etp_iam?options=-c%20TimeZone%3DUTC
spring.datasource.username=${ETP_IAM_DB_USERNAME:etp_admin}
spring.datasource.password=${ETP_IAM_DB_PASSWORD:change_me}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
