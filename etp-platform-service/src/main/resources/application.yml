spring:
  application:
    name: etp-platform-service

  datasource:
    url: ${ETP_DB_URL:jdbc:postgresql://localhost:5434/etp_platform}
    username: ${ETP_DB_USERNAME:etp_admin}
    password: ${ETP_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        options: "-c TimeZone=UTC"

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${ETP_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/swagger-ui

etp:
  platform:
    name: Enterprise Technology Platform
    version: 0.1.0-SNAPSHOT
